<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goatedTech — iPhone Spec Reference</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="./" class="site-name">goatedTech</a>
    </div>
  </header>

  <main>
    <section class="section-band" style="background: var(--white);">
      <div class="container">
        <div class="search-wrapper">
          <input type="search" id="search-input" placeholder="Search iPhones..." aria-label="Search iPhones">
        </div>
      </div>
    </section>

    <section class="section-band" style="background: var(--surface);">
      <div class="container">
        <div class="filter-chips" role="group" aria-label="Filter by category">
          <button class="chip" data-filter="category" data-value="flagship">Flagship</button>
          <button class="chip" data-filter="category" data-value="foldable">Foldable</button>
        </div>
        <div class="filter-chips" role="group" aria-label="Filter by year">
          <button class="chip" data-filter="year" data-value="2022">2022</button>
          <button class="chip" data-filter="year" data-value="2023">2023</button>
          <button class="chip" data-filter="year" data-value="2024">2024</button>
          <button class="chip" data-filter="year" data-value="2025">2025</button>
          <button class="chip" data-filter="year" data-value="2026">2026</button>
        </div>
      </div>
    </section>

    <section class="section-band" style="background: var(--white);">
      <div class="container">
        <div id="phone-grid" class="phone-grid" role="list"></div>
      </div>
    </section>
  </main>

  <script src="js/phones-data.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('phone-grid');
      const searchInput = document.getElementById('search-input');
      const chips = document.querySelectorAll('.chip');

      let activeFilters = { category: new Set(), year: new Set() };
      let searchQuery = '';

      function render() {
        const filtered = PHONES.filter(phone => {
          const matchesSearch = phone.name.toLowerCase().includes(searchQuery);
          const matchesCategory = activeFilters.category.size === 0 || activeFilters.category.has(phone.category);
          const matchesYear = activeFilters.year.size === 0 || activeFilters.year.has(String(phone.year));
          return matchesSearch && matchesCategory && matchesYear;
        });

        grid.innerHTML = filtered.map(phone => `
          <article class="phone-card" role="listitem">
            <a href="phones/${phone.id}.html">
              <div class="card-illustration" aria-hidden="true">
                <img src="img/${phone.id}.svg" alt="" class="card-svg">
              </div>
              <div class="card-content">
                <h2 class="card-name section-heading">${phone.name}</h2>
                <p class="card-spec">${phone.chip || '-'} | ${phone.display?.size || phone.display?.inner || '-'}in</p>
              </div>
            </a>
          </article>
        `).join('');
      }

      searchInput.addEventListener('input', e => {
        searchQuery = e.target.value.toLowerCase().trim();
        render();
      });

      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          const filter = chip.dataset.filter;
          const value = chip.dataset.value;
          const set = activeFilters[filter];
          if (set.has(value)) set.delete(value);
          else set.add(value);
          chip.classList.toggle('active', set.has(value));
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
