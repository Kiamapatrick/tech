<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goatedTech — iPhone Spec Reference</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="./" class="site-name">goatedTech</a>
    </div>
  </header>

  <main>
    <section class="section-band" style="background: var(--white);">
      <div class="container">
        <div class="search-wrapper">
          <input type="search" id="search-input" placeholder="Search iPhones..." aria-label="Search iPhones" autocomplete="off">
          <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>Clear</button>
        </div>
        <div id="search-results-count" class="search-results-count" aria-live="polite" aria-atomic="true"></div>
      </div>
    </section>

    <section class="section-band" style="background: var(--surface);">
      <div class="container">
        <div class="controls-row">
          <div class="filter-chips" role="group" aria-label="Filter by category">
            <button class="chip" data-filter="category" data-value="budget" aria-pressed="false">Budget</button>
            <button class="chip" data-filter="category" data-value="mini" aria-pressed="false">Mini</button>
            <button class="chip" data-filter="category" data-value="standard" aria-pressed="false">Standard</button>
            <button class="chip" data-filter="category" data-value="flagship" aria-pressed="false">Flagship</button>
            <button class="chip" data-filter="category" data-value="foldable" aria-pressed="false">Foldable</button>
          </div>
          <div class="filter-chips" role="group" aria-label="Filter by year">
            <button class="chip" data-filter="year" data-value="2007" aria-pressed="false">2007</button>
            <button class="chip" data-filter="year" data-value="2008" aria-pressed="false">2008</button>
            <button class="chip" data-filter="year" data-value="2009" aria-pressed="false">2009</button>
            <button class="chip" data-filter="year" data-value="2010" aria-pressed="false">2010</button>
            <button class="chip" data-filter="year" data-value="2011" aria-pressed="false">2011</button>
            <button class="chip" data-filter="year" data-value="2012" aria-pressed="false">2012</button>
            <button class="chip" data-filter="year" data-value="2013" aria-pressed="false">2013</button>
            <button class="chip" data-filter="year" data-value="2014" aria-pressed="false">2014</button>
            <button class="chip" data-filter="year" data-value="2015" aria-pressed="false">2015</button>
            <button class="chip" data-filter="year" data-value="2016" aria-pressed="false">2016</button>
            <button class="chip" data-filter="year" data-value="2017" aria-pressed="false">2017</button>
            <button class="chip" data-filter="year" data-value="2018" aria-pressed="false">2018</button>
            <button class="chip" data-filter="year" data-value="2019" aria-pressed="false">2019</button>
            <button class="chip" data-filter="year" data-value="2020" aria-pressed="false">2020</button>
            <button class="chip" data-filter="year" data-value="2021" aria-pressed="false">2021</button>
            <button class="chip" data-filter="year" data-value="2022" aria-pressed="false">2022</button>
            <button class="chip" data-filter="year" data-value="2023" aria-pressed="false">2023</button>
            <button class="chip" data-filter="year" data-value="2024" aria-pressed="false">2024</button>
            <button class="chip" data-filter="year" data-value="2025" aria-pressed="false">2025</button>
            <button class="chip" data-filter="year" data-value="2026" aria-pressed="false">2026</button>
          </div>
          <div class="sort-control">
            <label for="sort-select" class="sort-label">Sort:</label>
            <select id="sort-select" class="sort-select" aria-label="Sort phones">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="price-asc">Price low to high</option>
              <option value="price-desc">Price high to low</option>
              <option value="screen-asc">Screen size small to large</option>
              <option value="screen-desc">Screen size large to small</option>
              <option value="battery-asc">Battery low to high</option>
              <option value="battery-desc">Battery high to low</option>
              <option value="weight-asc">Lightest</option>
              <option value="weight-desc">Heaviest</option>
            </select>
          </div>
        </div>
        <div id="active-filters-bar" class="active-filters-bar" hidden>
          <span class="active-filters-label">Active filters:</span>
          <div id="active-filters-list" class="active-filters-list"></div>
          <button type="button" id="clear-all-filters" class="clear-all-btn">Clear all</button>
        </div>
      </div>
    </section>

    <section class="section-band" style="background: var(--white);">
      <div class="container">
        <div id="phone-grid" class="phone-grid" role="list"></div>
        <div id="empty-state" class="empty-state" hidden>
          <p>No phones match your search and filters.</p>
          <button type="button" id="empty-clear" class="compare-btn">Clear filters</button>
        </div>
      </div>
    </section>
  </main>

  <div id="compare-tray" class="compare-tray" hidden>
    <div class="compare-tray-inner">
      <span class="compare-tray-label">Compare:</span>
      <div id="compare-tray-items" class="compare-tray-items"></div>
      <div class="compare-tray-actions">
        <button type="button" id="compare-tray-compare" class="compare-btn">Compare</button>
        <button type="button" id="compare-tray-clear" class="compare-btn compare-btn-secondary">Clear</button>
      </div>
      <p id="compare-tray-max-msg" class="compare-tray-max-msg" hidden>Maximum 3 phones for comparison</p>
    </div>
  </div>

  <script src="js/phones-data.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('phone-grid');
      const searchInput = document.getElementById('search-input');
      const searchClear = document.getElementById('search-clear');
      const resultsCount = document.getElementById('search-results-count');
      const chips = document.querySelectorAll('.chip');
      const sortSelect = document.getElementById('sort-select');
      const activeFiltersBar = document.getElementById('active-filters-bar');
      const activeFiltersList = document.getElementById('active-filters-list');
      const clearAllBtn = document.getElementById('clear-all-filters');
      const emptyState = document.getElementById('empty-state');
      const emptyClearBtn = document.getElementById('empty-clear');
      const compareTray = document.getElementById('compare-tray');
      const compareTrayItems = document.getElementById('compare-tray-items');
      const compareTrayCompare = document.getElementById('compare-tray-compare');
      const compareTrayClear = document.getElementById('compare-tray-clear');
      const compareTrayMaxMsg = document.getElementById('compare-tray-max-msg');
      const siteHeader = document.querySelector('.site-header');

      let activeFilters = { category: new Set(), year: new Set() };
      let searchQuery = '';
      let sortOrder = 'newest';
      let compareSelection = [];

      const STORAGE_KEY = 'goatedTech_compare';

      function loadCompareSelection() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            compareSelection = JSON.parse(stored).filter(id => PHONES.some(p => p.id === id));
          }
        } catch (e) {
          compareSelection = [];
        }
      }

      function saveCompareSelection() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(compareSelection));
        } catch (e) {}
      }

      function updateCompareTray() {
        compareTrayItems.innerHTML = compareSelection.map(id => {
          const phone = PHONES.find(p => p.id === id);
          if (!phone) return '';
          return `
            <div class="compare-tray-item" data-id="${phone.id}">
              <span class="compare-tray-item-name">${phone.name}</span>
              <button type="button" class="compare-tray-item-remove" aria-label="Remove ${phone.name}">x</button>
            </div>
          `;
        }).join('');

        const hasSelection = compareSelection.length > 0;
        compareTray.hidden = !hasSelection;
        compareTray.classList.toggle('visible', hasSelection);
        compareTrayCompare.disabled = compareSelection.length < 2;
        compareTrayMaxMsg.hidden = compareSelection.length < 3;
      }

      function addToCompare(id) {
        if (compareSelection.includes(id)) return;
        if (compareSelection.length >= 3) {
          compareTrayMaxMsg.hidden = false;
          setTimeout(() => { compareTrayMaxMsg.hidden = true; }, 2000);
          return;
        }
        compareSelection.push(id);
        saveCompareSelection();
        updateCompareTray();
        updateCardCompareButtons();
      }

      function removeFromCompare(id) {
        compareSelection = compareSelection.filter(i => i !== id);
        saveCompareSelection();
        updateCompareTray();
        updateCardCompareButtons();
      }

      function clearCompare() {
        compareSelection = [];
        saveCompareSelection();
        updateCompareTray();
        updateCardCompareButtons();
      }

      function updateCardCompareButtons() {
        document.querySelectorAll('.card-compare-toggle').forEach(btn => {
          const id = btn.dataset.id;
          const isSelected = compareSelection.includes(id);
          btn.classList.toggle('active', isSelected);
          btn.setAttribute('aria-pressed', isSelected);
          btn.textContent = isSelected ? 'Selected' : 'Compare';
        });
      }

      function getSortSpec(field) {
        const specs = {
          'newest': { getValue: p => p.released ? new Date(p.released).getTime() : null, dir: 'desc' },
          'oldest': { getValue: p => p.released ? new Date(p.released).getTime() : null, dir: 'asc' },
          'price-asc': { getValue: p => p.price === null ? null : (Array.isArray(p.price) ? p.price[0] : p.price), dir: 'asc' },
          'price-desc': { getValue: p => p.price === null ? null : (Array.isArray(p.price) ? p.price[0] : p.price), dir: 'desc' },
          'screen-asc': {
            getValue: p => {
              if (p.display?.size) return p.display.size;
              if (p.display?.inner) return p.display.inner;
              return null;
            },
            dir: 'asc'
          },
          'screen-desc': {
            getValue: p => {
              if (p.display?.size) return p.display.size;
              if (p.display?.inner) return p.display.inner;
              return null;
            },
            dir: 'desc'
          },
          'battery-asc': { getValue: p => p.battery_mah === null ? null : p.battery_mah, dir: 'asc' },
          'battery-desc': { getValue: p => p.battery_mah === null ? null : p.battery_mah, dir: 'desc' },
          'weight-asc': { getValue: p => p.weight_g === null ? null : p.weight_g, dir: 'asc' },
          'weight-desc': { getValue: p => p.weight_g === null ? null : p.weight_g, dir: 'desc' }
        };
        return specs[field] || specs['newest'];
      }

      function sortPhones(phones) {
        const spec = getSortSpec(sortOrder);
        return [...phones].sort((a, b) => {
          const av = spec.getValue(a);
          const bv = spec.getValue(b);

          // Both null -> tie, fall back to release date newest first
          if (av === null && bv === null) {
            const ad = a.released ? new Date(a.released).getTime() : 0;
            const bd = b.released ? new Date(b.released).getTime() : 0;
            return bd - ad;
          }
          // a null -> a goes last
          if (av === null) return 1;
          // b null -> b goes last
          if (bv === null) return -1;

          // Both have values
          const cmp = spec.dir === 'asc' ? av - bv : bv - av;
          if (cmp !== 0) return cmp;

          // Tie-breaker: release date, newest first
          const ad = a.released ? new Date(a.released).getTime() : 0;
          const bd = b.released ? new Date(b.released).getTime() : 0;
          return bd - ad;
        });
      }

      function getUrlState() {
        const params = new URLSearchParams(window.location.search);
        return {
          q: params.get('q') || '',
          category: params.getAll('category'),
          year: params.getAll('year'),
          sort: params.get('sort') || 'newest'
        };
      }

      function setUrlState() {
        const params = new URLSearchParams();
        if (searchQuery) params.set('q', searchQuery);
        activeFilters.category.forEach(v => params.append('category', v));
        activeFilters.year.forEach(v => params.append('year', v));
        if (sortOrder !== 'newest') params.set('sort', sortOrder);
        const newUrl = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
        window.history.replaceState({}, '', newUrl);
      }

      function applyUrlState() {
        const state = getUrlState();
        searchQuery = state.q;
        searchInput.value = searchQuery;
        searchClear.hidden = !searchQuery;

        const validCategories = new Set();
        document.querySelectorAll('.chip[data-filter="category"]').forEach(c => validCategories.add(c.dataset.value));
        const validYears = new Set();
        document.querySelectorAll('.chip[data-filter="year"]').forEach(c => validYears.add(c.dataset.value));
        const validSorts = new Set([...sortSelect.options].map(o => o.value));

        activeFilters.category.clear();
        state.category.forEach(v => { if (validCategories.has(v)) activeFilters.category.add(v); });
        activeFilters.year.clear();
        state.year.forEach(v => { if (validYears.has(v)) activeFilters.year.add(v); });

        sortOrder = validSorts.has(state.sort) ? state.sort : 'newest';
        sortSelect.value = sortOrder;

        chips.forEach(chip => {
          const filter = chip.dataset.filter;
          const value = chip.dataset.value;
          const isActive = activeFilters[filter]?.has(value);
          chip.classList.toggle('active', isActive);
          chip.setAttribute('aria-pressed', isActive);
        });

        render();
        updateActiveFiltersBar();
      }

      function updateActiveFiltersBar() {
        const hasFilters = searchQuery || activeFilters.category.size > 0 || activeFilters.year.size > 0 || sortOrder !== 'newest';
        activeFiltersBar.hidden = !hasFilters;

        if (!hasFilters) return;

        const parts = [];
        if (searchQuery) parts.push({ type: 'search', label: `Search: "${searchQuery}"` });
        activeFilters.category.forEach(v => parts.push({ type: 'category', value: v, label: `Category: ${v}` }));
        activeFilters.year.forEach(v => parts.push({ type: 'year', value: v, label: `Year: ${v}` }));
        if (sortOrder !== 'newest' && sortSelect.options[sortSelect.selectedIndex]) parts.push({ type: 'sort', label: `Sort: ${sortSelect.options[sortSelect.selectedIndex].text}` });

        activeFiltersList.innerHTML = parts.map(p => `
          <span class="active-filter-tag" data-type="${p.type}" data-value="${p.value || ''}">
            ${p.label}
            <button type="button" class="active-filter-remove" aria-label="Remove ${p.label}">x</button>
          </span>
        `).join('');
      }

      function matchesSearch(phone) {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (
          phone.name.toLowerCase().includes(q) ||
          (phone.chip && phone.chip.toLowerCase().includes(q)) ||
          String(phone.year).includes(q) ||
          phone.category.toLowerCase().includes(q)
        );
      }

      let isRendering = false;
      let lastCards = new Map();

      function getCardRects() {
        const rects = new Map();
        grid.querySelectorAll('.phone-card').forEach(card => {
          const id = card.querySelector('.card-compare-toggle')?.dataset.id;
          if (id) rects.set(id, card.getBoundingClientRect());
        });
        return rects;
      }

      function animateFlip(newCards) {
        const firstRender = lastCards.size === 0;
        if (firstRender || document.documentElement.classList.contains('reduce-motion')) {
          lastCards = newCards;
          return Promise.resolve();
        }

        const animations = [];
        newCards.forEach((rect, id) => {
          const oldRect = lastCards.get(id);
          if (!oldRect) return;

          const card = grid.querySelector(`.card-compare-toggle[data-id="${id}"]`)?.closest('.phone-card');
          if (!card) return;

          const dx = oldRect.left - rect.left;
          const dy = oldRect.top - rect.top;
          const dw = oldRect.width / rect.width;
          const dh = oldRect.height / rect.height;

          card.style.transformOrigin = 'top left';
          card.style.transition = 'transform 200ms cubic-bezier(0.25, 0.1, 0.25, 1)';
          card.style.transform = `translate(${dx}px, ${dy}px) scale(${dw}, ${dh})`;

          animations.push(new Promise(resolve => {
            requestAnimationFrame(() => {
              card.style.transform = 'none';
              card.addEventListener('transitionend', () => {
                card.style.transition = '';
                card.style.transformOrigin = '';
                resolve();
              }, { once: true });
            });
          }));
        });

        lastCards = newCards;
        return Promise.all(animations);
      }

      function staggerReveal(cards) {
        if (document.documentElement.classList.contains('reduce-motion')) {
          cards.forEach(c => c.classList.add('visible'));
          return;
        }
        cards.forEach((card, i) => {
          card.style.transitionDelay = `${i * 40}ms`;
          requestAnimationFrame(() => {
            card.classList.add('visible');
          });
        });
      }

      function render() {
        let filtered = PHONES.filter(phone => {
          const matchesSearch = phone.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (phone.chip && phone.chip.toLowerCase().includes(searchQuery.toLowerCase())) ||
            String(phone.year).includes(searchQuery) ||
            phone.category.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesCategory = activeFilters.category.size === 0 || activeFilters.category.has(phone.category);
          const matchesYear = activeFilters.year.size === 0 || activeFilters.year.has(String(phone.year));
          return matchesSearch && matchesCategory && matchesYear;
        });

        filtered = sortPhones(filtered);

        const count = filtered.length;
        resultsCount.textContent = count === 1 ? '1 phone' : `${count} phones`;

        if (count === 0) {
          grid.innerHTML = '';
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;

        const prevRects = getCardRects();
        const newIds = filtered.map(p => p.id);

        grid.innerHTML = filtered.map((phone, index) => {
          const isSelected = compareSelection.includes(phone.id);
          return `
            <article class="phone-card reveal" role="listitem" style="transition-delay: ${index * 40}ms;">
              <a href="phones/${phone.id}.html">
                <div class="card-illustration" aria-hidden="true">
                  <img src="img/${phone.id}.svg" alt="" class="card-svg">
                </div>
                <div class="card-content">
                  <h2 class="card-name section-heading">${phone.name}</h2>
                  <p class="card-spec">${phone.chip || '-'} | ${phone.display?.size || phone.display?.inner || '-'}in</p>
                </div>
              </a>
              <button type="button" class="card-compare-toggle ${isSelected ? 'active' : ''}" data-id="${phone.id}" aria-pressed="${isSelected}" aria-label="${isSelected ? 'Remove from comparison' : 'Add to comparison'}">${isSelected ? 'Selected' : 'Compare'}</button>
            </article>
          `;
        }).join('');

        const newRects = getCardRects();
        animateFlip(newRects).then(() => {
          const cards = grid.querySelectorAll('.phone-card');
          staggerReveal(cards);
        });

        grid.querySelectorAll('.card-compare-toggle').forEach(btn => {
          btn.addEventListener('click', e => {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.dataset.id;
            if (compareSelection.includes(id)) {
              removeFromCompare(id);
            } else {
              addToCompare(id);
            }
          });
        });
      }

      function handleChipClick(chip) {
        const filter = chip.dataset.filter;
        const value = chip.dataset.value;
        const set = activeFilters[filter];
        if (set.has(value)) set.delete(value);
        else set.add(value);
        chip.classList.toggle('active', set.has(value));
        chip.setAttribute('aria-pressed', set.has(value));
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleSearchInput() {
        searchQuery = searchInput.value.toLowerCase().trim();
        searchClear.hidden = !searchQuery;
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleSortChange() {
        sortOrder = sortSelect.value;
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleActiveFilterRemove(e) {
        const tag = e.target.closest('.active-filter-tag');
        if (!tag) return;
        const type = tag.dataset.type;
        const value = tag.dataset.value;
        if (type === 'search') {
          searchQuery = '';
          searchInput.value = '';
          searchClear.hidden = true;
        } else if (type === 'category') {
          activeFilters.category.delete(value);
        } else if (type === 'year') {
          activeFilters.year.delete(value);
        } else if (type === 'sort') {
          sortOrder = 'newest';
          sortSelect.value = 'newest';
        }
        chips.forEach(chip => {
          const filter = chip.dataset.filter;
          const val = chip.dataset.value;
          const isActive = activeFilters[filter]?.has(val);
          chip.classList.toggle('active', isActive);
          chip.setAttribute('aria-pressed', isActive);
        });
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleClearAll() {
        searchQuery = '';
        searchInput.value = '';
        searchClear.hidden = true;
        activeFilters.category.clear();
        activeFilters.year.clear();
        sortOrder = 'newest';
        sortSelect.value = 'newest';
        chips.forEach(chip => {
          chip.classList.remove('active');
          chip.setAttribute('aria-pressed', 'false');
        });
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleSearchClear() {
        searchQuery = '';
        searchInput.value = '';
        searchClear.hidden = true;
        searchInput.focus();
        render();
        updateActiveFiltersBar();
        setUrlState();
      }

      function handleEmptyClear() {
        handleClearAll();
        searchInput.focus();
      }

      function handleKeydown(e) {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchQuery = '';
          searchClear.hidden = true;
          searchInput.blur();
          render();
          updateActiveFiltersBar();
          setUrlState();
        }
      }

      function handleScroll() {
        if (window.scrollY > 8) {
          siteHeader.classList.add('scrolled');
        } else {
          siteHeader.classList.remove('scrolled');
        }
      }

      searchInput.addEventListener('input', handleSearchInput);
      searchClear.addEventListener('click', handleSearchClear);
      sortSelect.addEventListener('change', handleSortChange);
      chips.forEach(chip => chip.addEventListener('click', () => handleChipClick(chip)));
      activeFiltersList.addEventListener('click', handleActiveFilterRemove);
      clearAllBtn.addEventListener('click', handleClearAll);
      emptyClearBtn.addEventListener('click', handleEmptyClear);
      compareTrayCompare.addEventListener('click', () => {
        if (compareSelection.length >= 2) {
          window.location.href = `compare.html?ids=${compareSelection.join(',')}`;
        }
      });
      compareTrayClear.addEventListener('click', clearCompare);
      compareTrayItems.addEventListener('click', e => {
        const removeBtn = e.target.closest('.compare-tray-item-remove');
        if (removeBtn) {
          const item = removeBtn.closest('.compare-tray-item');
          if (item) removeFromCompare(item.dataset.id);
        }
      });
      document.addEventListener('keydown', handleKeydown);
      window.addEventListener('scroll', handleScroll, { passive: true });

      loadCompareSelection();
      applyUrlState();
      updateCompareTray();

      // Initial reveal
      requestAnimationFrame(() => {
        const cards = grid.querySelectorAll('.phone-card');
        staggerReveal(cards);
      });
    })();
  </script>
</body>
</html>
