<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 838" width="400" height="838" aria-hidden="true">
  <defs>
    <!-- Body 3-stop gradient: light top edge → mid → slightly darker bottom edge -->
    <linearGradient id="bodyGrad_iphone-17-pro-max" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f8fc" stop-opacity="1"/>
      <stop offset="40%" stop-color="#e8e8f0" stop-opacity="1"/>
      <stop offset="75%" stop-color="#d0d0dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b8b8c8" stop-opacity="1"/>
    </linearGradient>

    <!-- Top highlight for glass curvature -->
    <linearGradient id="bodyHighlight_iphone-17-pro-max" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen: dark off-display with subtle gradient -->
    <linearGradient id="screenGrad_iphone-17-pro-max" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="50%" stop-color="#121222" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a15" stop-opacity="1"/>
    </linearGradient>

    <!-- Camera plateau: slightly darker than body -->
    <linearGradient id="camPlateauGrad_iphone-17-pro-max" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8d8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#b0b0c0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9898a8" stop-opacity="1"/>
    </linearGradient>

    <!-- Lens radial gradient: dark center, lighter rim -->
    <radialGradient id="lensGrad_iphone-17-pro-max" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a3a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#12122a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080818" stop-opacity="1"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow_iphone-17-pro-max" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Inner shadow for screen depth -->
    <filter id="shadow_iphone-17-pro-max_inner" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite in="SourceGraphic" in2="offset-blur" operator="over"/>
    </filter>
  </defs>
    <rect x="26" y="34" width="356" height="788" rx="28" fill="#000000" opacity="0.08" filter="url(#shadow_iphone-17-pro-max)"/>
    <rect x="20" y="20" width="360" height="798" rx="30" fill="url(#bodyGrad_iphone-17-pro-max)" stroke="#6d2331" stroke-width="1.8" filter="url(#shadow_iphone-17-pro-max)"/>
    <rect x="24" y="24" width="352" height="144" rx="27" fill="url(#bodyHighlight_iphone-17-pro-max)"/>
    <rect x="33" y="48" width="334" height="742" rx="22" fill="url(#screenGrad_iphone-17-pro-max)" filter="url(#shadow_iphone-17-pro-max_inner)"/>
      <!-- Dynamic Island -->
      <rect x="163.5" y="67" width="73" height="13" rx="7" fill="#080815"/>
    
    <rect x="42" y="68" width="65" height="65" rx="13" fill="url(#camPlateauGrad_iphone-17-pro-max)" stroke="#888898" stroke-width="0.8"/>
      <!-- Lens 1 -->
      <circle cx="74.5" cy="87" r="9" fill="url(#lensGrad_iphone-17-pro-max)"/>
      <circle cx="74.5" cy="87" r="6" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.5"/>
      <circle cx="74.5" cy="87" r="3" fill="#050510" opacity="0.9"/>
    
      <!-- Lens 2 -->
      <circle cx="61" cy="109.5" r="9" fill="url(#lensGrad_iphone-17-pro-max)"/>
      <circle cx="61" cy="109.5" r="6" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.5"/>
      <circle cx="61" cy="109.5" r="3" fill="#050510" opacity="0.9"/>
    
      <!-- Lens 3 -->
      <circle cx="88" cy="109.5" r="9" fill="url(#lensGrad_iphone-17-pro-max)"/>
      <circle cx="88" cy="109.5" r="6" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.5"/>
      <circle cx="88" cy="109.5" r="3" fill="#050510" opacity="0.9"/>
    
    <circle cx="96" cy="79" r="2" fill="#e8e8f0" opacity="0.8"/>
  
      <!-- Volume rocker (left) -->
      <rect x="16" y="243" width="3" height="96" rx="1.5" fill="#6d2331" opacity="0.35"/>
      <rect x="16" y="355" width="3" height="96" rx="1.5" fill="#6d2331" opacity="0.35"/>
      <!-- Action button (left, separate) -->
      <rect x="16" y="483" width="3" height="67" rx="1.5" fill="#6d2331" opacity="0.45"/>
      <!-- Power button (right) -->
      <rect x="382" y="483" width="3" height="134" rx="1.5" fill="#6d2331" opacity="0.35"/>
    </svg>