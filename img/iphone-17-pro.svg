<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" aria-hidden="true">
  <defs>
    <!-- Phone body gradient: light top to slightly darker bottom for glass/metal feel -->
    <linearGradient id="phoneBodyGrad_iphone-17-pro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f0f0f5" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#e8e8f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d8d8e8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Lens gradient: dark glass look -->
    <radialGradient id="lensGrad_iphone-17-pro" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a2a4a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#1a1a3a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="1"/>
    </radialGradient>

    <!-- Drop shadow filter for phone body and lenses -->
    <filter id="phoneShadow_iphone-17-pro" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Subtle inner highlight for phone body -->
    <linearGradient id="phoneBodyGrad_iphone-17-pro_highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft drop shadow under phone shape only -->
  <rect x="54" y="42" width="292" height="428" rx="38" fill="#000000" opacity="0.06" filter="url(#phoneShadow_iphone-17-pro)"/>

  <!-- Phone body with gradient fill -->
  <rect x="50" y="30" width="300" height="440" rx="40" fill="url(#phoneBodyGrad_iphone-17-pro)" filter="url(#phoneShadow_iphone-17-pro)"/>

  <!-- Subtle top highlight for glass feel -->
  <rect x="54" y="34" width="292" height="60" rx="38" fill="url(#phoneBodyGrad_iphone-17-pro_highlight)"/>

  <!-- Camera module background -->
  <rect x="160" y="26" width="80" height="32" rx="8" fill="#1a1a2e" opacity="0.15"/>

  <!-- Dynamic Island / Notch -->
  
    <rect x="160" y="26" width="80" height="8" rx="4" fill="#1a1a2e" opacity="0.25"/>
  

  
      <!-- Lens 1 -->
      <circle cx="200" cy="70" r="18" fill="url(#lensGrad_iphone-17-pro)" filter="url(#phoneShadow_iphone-17-pro)"/>
      <circle cx="200" cy="70" r="9.9" fill="none" stroke="#1a1a2e" stroke-width="1.5" opacity="0.3"/>
      <circle cx="200" cy="70" r="4.5" fill="#0a0a1a" opacity="0.6"/>
    
      <!-- Lens 2 -->
      <circle cx="175" cy="115" r="18" fill="url(#lensGrad_iphone-17-pro)" filter="url(#phoneShadow_iphone-17-pro)"/>
      <circle cx="175" cy="115" r="9.9" fill="none" stroke="#1a1a2e" stroke-width="1.5" opacity="0.3"/>
      <circle cx="175" cy="115" r="4.5" fill="#0a0a1a" opacity="0.6"/>
    
      <!-- Lens 3 -->
      <circle cx="225" cy="115" r="18" fill="url(#lensGrad_iphone-17-pro)" filter="url(#phoneShadow_iphone-17-pro)"/>
      <circle cx="225" cy="115" r="9.9" fill="none" stroke="#1a1a2e" stroke-width="1.5" opacity="0.3"/>
      <circle cx="225" cy="115" r="4.5" fill="#0a0a1a" opacity="0.6"/>
    

  
      <circle cx="200" cy="155" r="5" fill="#f5f0e8" opacity="0.7" filter="url(#phoneShadow_iphone-17-pro)"/>
    

  <!-- Side button indicator -->
  <rect x="42" y="180" width="4" height="60" rx="2" fill="#d8d8e8" opacity="0.4"/>
  <rect x="354" y="180" width="4" height="40" rx="2" fill="#d8d8e8" opacity="0.4"/>
</svg>