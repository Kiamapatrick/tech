<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" width="400" height="286" aria-hidden="true">
  <defs>
    <!-- Body 3-stop gradient: light top edge → mid → slightly darker bottom edge -->
    <linearGradient id="bodyGrad_iphone-duo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f8fc" stop-opacity="1"/>
      <stop offset="40%" stop-color="#e8e8f0" stop-opacity="1"/>
      <stop offset="75%" stop-color="#d0d0dc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b8b8c8" stop-opacity="1"/>
    </linearGradient>

    <!-- Top highlight for glass curvature -->
    <linearGradient id="bodyHighlight_iphone-duo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen: dark off-display with subtle gradient -->
    <linearGradient id="screenGrad_iphone-duo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="50%" stop-color="#121222" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a15" stop-opacity="1"/>
    </linearGradient>

    <!-- Camera plateau: slightly darker than body -->
    <linearGradient id="camPlateauGrad_iphone-duo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8d8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#b0b0c0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9898a8" stop-opacity="1"/>
    </linearGradient>

    <!-- Lens radial gradient: dark center, lighter rim -->
    <radialGradient id="lensGrad_iphone-duo" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a3a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#12122a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080818" stop-opacity="1"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow_iphone-duo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Inner shadow for screen depth -->
    <filter id="shadow_iphone-duo_inner" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite in="SourceGraphic" in2="offset-blur" operator="over"/>
    </filter>
  </defs>
    <rect x="26" y="34" width="169" height="236" rx="28" fill="#000000" opacity="0.08" filter="url(#shadow_iphone-duo)"/>
    <rect x="213" y="34" width="169" height="236" rx="28" fill="#000000" opacity="0.08" filter="url(#shadow_iphone-duo)"/>
    <rect x="20" y="20" width="173" height="246" rx="30" fill="url(#bodyGrad_iphone-duo)" stroke="#6d2331" stroke-width="1.8" filter="url(#shadow_iphone-duo)"/>
    <rect x="24" y="24" width="165" height="44" rx="27" fill="url(#bodyHighlight_iphone-duo)"/>
    <rect x="26" y="29" width="161" height="228" rx="22" fill="url(#screenGrad_iphone-duo)" filter="url(#shadow_iphone-duo_inner)"/>
    <rect x="207" y="20" width="173" height="246" rx="30" fill="url(#bodyGrad_iphone-duo)" stroke="#6d2331" stroke-width="1.8" filter="url(#shadow_iphone-duo)"/>
    <rect x="211" y="24" width="165" height="44" rx="27" fill="url(#bodyHighlight_iphone-duo)"/>
    <rect x="213" y="29" width="161" height="228" rx="22" fill="url(#screenGrad_iphone-duo)" filter="url(#shadow_iphone-duo_inner)"/>
    <rect x="193" y="94" width="14" height="98" rx="7" fill="#b8b8c8" stroke="#9898a8" stroke-width="0.8"/>
    <rect x="30" y="35" width="28" height="28" rx="8" fill="url(#camPlateauGrad_iphone-duo)" stroke="#888898" stroke-width="0.8"/>
    <circle cx="44" cy="49" r="6" fill="url(#lensGrad_iphone-duo)"/>
    <circle cx="44" cy="49" r="4" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.5"/>
    <circle cx="44" cy="49" r="2" fill="#050510" opacity="0.9"/>
    <circle cx="51" cy="42" r="2" fill="#e8e8f0" opacity="0.8"/>
    <rect x="311" y="69" width="28" height="28" rx="8" fill="url(#camPlateauGrad_iphone-duo)" stroke="#888898" stroke-width="0.8" opacity="0.6"/>
    <circle cx="325" cy="83" r="6" fill="url(#lensGrad_iphone-duo)" opacity="0.6"/>
    <circle cx="325" cy="83" r="4" fill="none" stroke="#2a2a4a" stroke-width="1.5" opacity="0.3"/>
    <circle cx="325" cy="83" r="2" fill="#050510" opacity="0.5"/></svg>