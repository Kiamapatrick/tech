<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goatedTech</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="../" class="site-name">goatedTech</a>
    </div>
  </header>

  <main>
    <section class="section-band device-hero" style="background: var(--white);">
      <div class="container">
        <div class="device-illustration" aria-hidden="true"></div>
        <h1 class="device-name"></h1>
        <div class="device-meta"></div>
      </div>
    </section>

    <section class="section-band" style="background: var(--surface);">
      <div class="container">
        <div class="headline-stats"></div>
      </div>
    </section>

    <section class="section-band" style="background: var(--white);">
      <div class="container">
        <div id="spec-sections"></div>
      </div>
    </section>

    <section class="section-band" style="background: var(--surface);">
      <div class="container" style="text-align: center;">
        <a class="compare-btn" href="#">Compare this phone</a>
      </div>
    </section>
  </main>

  <script>window.PHONE_ID = "iphone-17-pro";</script>
  <script src="../js/phones-data.js"></script>
  <script src="../js/device-page.js"></script>
</body>
</html>
